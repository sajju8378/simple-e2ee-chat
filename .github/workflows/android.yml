name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, trail-attachments ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        working-directory: server
        run: npm install
      - name: Backend health and real message smoke test
        working-directory: server
        run: |
          node src/server.js > /tmp/simple-e2ee-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:8080/health && break || sleep 1; done
          curl --fail --silent http://127.0.0.1:8080/health | jq -e '.ok == true and .database == "sqlite"'
          A=$(curl --fail --silent --show-error -H 'Content-Type: application/json' -d '{"username":"alice_ci","displayName":"CI Alice","passwordHash":"BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB","publicKey":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA","keyBackup":"111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111"}' http://127.0.0.1:8080/v1/register)
          B=$(curl --fail --silent --show-error -H 'Content-Type: application/json' -d '{"username":"bob_ci","displayName":"CI Bob","passwordHash":"CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC","publicKey":"CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC","keyBackup":"222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222"}' http://127.0.0.1:8080/v1/register)
          A_ID=$(echo "$A"|jq -r .id); A_TOKEN=$(echo "$A"|jq -r .token); B_ID=$(echo "$B"|jq -r .id); B_TOKEN=$(echo "$B"|jq -r .token)
          test "${A_ID#E2E-}" != "$A_ID"; test "${B_ID#E2E-}" != "$B_ID"; test "${#A_TOKEN}" -gt 20; test "${#B_TOKEN}" -gt 20
          echo "$A" | jq -e '.keyBackup | length > 100'
          curl --fail --silent -H "Authorization: Bearer $A_TOKEN" -H 'Content-Type: application/json' -d '{"keyBackup":"333333333333333333333333333333333333333333333333333333333333333333333333333333333333333333333333333333333333333333333333333333"}' http://127.0.0.1:8080/v1/account/backup | jq -e '.ok == true'
          LOGIN=$(curl --fail --silent --show-error -H 'Content-Type: application/json' -d '{"id":"alice_ci","passwordHash":"BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB"}' http://127.0.0.1:8080/v1/login)
          echo "$LOGIN" | jq -e '.username == "alice_ci"'
          echo "$LOGIN" | jq -e '.keyBackup | length > 100'
          curl --fail --silent -H "Authorization: Bearer $A_TOKEN" 'http://127.0.0.1:8080/v1/users/search?q=b' | jq -e '.users | length == 1 and .[0].username == "bob_ci"'
          curl --fail --silent -H "Authorization: Bearer $A_TOKEN" http://127.0.0.1:8080/v1/users/$B_ID | jq -e '.displayName == "CI Bob"'
          SENT=$(curl --fail --silent --show-error -H "Authorization: Bearer $A_TOKEN" -H 'Content-Type: application/json' -d "{\"to\":\"$B_ID\",\"from\":\"$A_ID\",\"envelope\":{\"ciphertext\":\"ci-test-ciphertext\",\"iv\":\"ci-test-iv\"}}" http://127.0.0.1:8080/v1/messages)
          echo "$SENT"|jq -e '.accepted == true'
          curl --fail --silent -H "Authorization: Bearer $B_TOKEN" http://127.0.0.1:8080/v1/conversations/$A_ID | jq -e '.messages | length == 1 and .[0].envelope.ciphertext == "ci-test-ciphertext"'
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        working-directory: apps/android
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-e2ee-chat-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
